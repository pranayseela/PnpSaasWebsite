<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand_gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D4FF"/>
      <stop offset="0.5" stop-color="#005BEA"/>
      <stop offset="1" stop-color="#B83AF3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="30"/>
      <feOffset dx="0" dy="15" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="white"/>
  <rect width="1200" height="630" fill="url(#brand_gradient)" opacity="0.03"/>
  
  <!-- Content Area -->
  <g filter="url(#shadow)">
    <!-- Icon (Full version) -->
    <rect x="120" y="165" width="300" height="300" rx="72" fill="url(#brand_gradient)"/>
    <path d="M270 216.6C215.7 216.6 171.7 253.9 171.7 300C171.7 325.8 187.2 348.5 210.9 364.4L191 407.8L238.8 382.7C248.6 385 259.1 386.2 270.1 386.2C324.4 386.2 368.4 348.9 368.4 302.9C368.4 256.9 324.4 219.6 270.1 219.6V216.6Z" fill="white"/>
    <!-- Waveform Cutouts -->
    <rect x="219" y="299" width="6" height="20" rx="3" fill="#005BEA"/>
    <rect x="239" y="278" width="6" height="61" rx="3" fill="#005BEA"/>
    <rect x="258" y="262" width="6" height="94" rx="3" fill="#005BEA"/>
    <rect x="278" y="273" width="6" height="72" rx="3" fill="#005BEA"/>
    <rect x="297" y="284" width="6" height="50" rx="3" fill="#005BEA"/>
    <rect x="317" y="299" width="6" height="20" rx="3" fill="#005BEA"/>
  </g>

  <!-- Text Section -->
  <text x="480" y="270" fill="#1D1D1F" style="font-family: 'Inter', sans-serif; font-size: 68px; font-weight: 700; letter-spacing: -0.04em;">Ai Assistant</text>
  <text x="480" y="335" fill="#1D1D1F" style="font-family: 'Inter', sans-serif; font-size: 30px; font-weight: 400; opacity: 0.7; letter-spacing: -0.01em;">The New Executive Standard.</text>
  
  <!-- Badge/Tags -->
  <rect x="480" y="380" width="180" height="40" rx="20" fill="#1D1D1F"/>
  <text x="505" y="406" fill="white" style="font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;">Privacy First</text>
  
  <text x="480" y="460" fill="#1D1D1F" style="font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600; opacity: 0.3; letter-spacing: 0.3em; text-transform: uppercase;">PnP Technologies</text>

  <!-- Subtle Bottom Branding -->
  <rect x="120" y="540" width="960" height="1" fill="#1D1D1F" opacity="0.05"/>
  <text x="120" y="580" fill="#1D1D1F" style="font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; opacity: 0.3; letter-spacing: 0.05em;">AI EXECUTIVE ASSISTANT — DESIGNED FOR THE APPLE ECOSYSTEM</text>
</svg>
